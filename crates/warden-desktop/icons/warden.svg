      <circle cx="89.2" cy="126.9" r="20.9" fill="url(#iris-shade)"/>
      <circle cx="90.6" cy="127.1" r="9.3" fill="url(#pupil)"/>
      <circle cx="95" cy="122.7" r="1.8" fill="#fbf8f7"/>
