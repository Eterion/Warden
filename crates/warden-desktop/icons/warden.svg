      <stop offset="56%" stop-color="#fff1e8" stop-opacity="25%"/>
      <stop offset="1" stop-color="#fff1e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheek-shade" gradientUnits="userSpaceOnUse" cx="61" cy="102" r="26" gradientTransform="matrix(1 0 0 .7 0 30.6)">
      <stop stop-color="#5c321c" stop-opacity="47%"/>
      <stop offset="1" stop-color="#92552b" stop-opacity="0"/>
