  <!-- Shadow -->
  <ellipse cx="128" cy="222.2" rx="28" ry="5.2" fill="url(#shadow)"/>

  <!-- Head and lower rim -->
  <use href="#head-shape" fill="url(#head-rim)"/>
  <use href="#head-inset" fill="url(#head)"/>

  <use href="#head-inset" fill="url(#brow-shadow)"/>
  <use href="#head-inset" transform="matrix(-1 0 0 1 256 0)" fill="url(#brow-shadow)"/>

  <!-- Cream face and cheek shading -->
  <use href="#face-shape" fill="url(#face)"/>
  <use href="#face-shape" fill="url(#face-light)"/>
  <use href="#face-shape" fill="url(#cheek-shade)"/>
  <use href="#face-shape" transform="matrix(-1 0 0 1 256 0)" fill="url(#cheek-shade)"/>
  <path id="face-edge" d="M54 126 C56 145 75 162 98 157 C103.7 156 108.6 153.5 112.8 151 C108.7 154 103.6 156.6 98 157.5 C74.8 162.8 55.9 145.3 54 126Z" fill="#ffebd8" opacity="75%"/>
  <use href="#face-edge" transform="matrix(-1 0 0 1 256 0)"/>

  <!-- Eyes -->
  <use href="#eye"/>
  <use href="#eye" transform="matrix(-1 0 0 1 256 0)"/>

  <!-- Brows -->
  <use href="#brow-shape" fill="url(#brow)"/>
  <use href="#brow-shape" transform="matrix(-1 0 0 1 256 0)" fill="url(#brow)"/>

  <!-- Upper rim, forehead and tufts -->
