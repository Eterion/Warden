  <use href="#cap" fill="url(#rim-light)"/>
  <use href="#cap-inset" fill="url(#forehead)"/>
  <use href="#cap-inset" fill="url(#crown-light)"/>
  <use href="#cap-inset" fill="url(#tuft-light)"/>
  <use href="#cap-inset" transform="matrix(-1 0 0 1 256 0)" fill="url(#tuft-light)"/>
  <path id="brow-edge" d="M43.7 86.1 C52.7 92.8 65.6 93.6 80 97.5 C102.4 102.4 121.8 115 124 129.2 C121.3 115.2 102.5 103 79.9 98 C65.5 94.1 52.6 93 43.7 86.1Z" fill="#ffe5cc" opacity="87%"/>
  <use href="#brow-edge" transform="matrix(-1 0 0 1 256 0)"/>

  <!-- Beak -->
  <ellipse cx="128" cy="156.7" rx="21" ry="24" fill="url(#beak-shadow)"/>
  <path d="M128 136.7 C130.9 136.7 136.9 139.5 140.3 142.3 Q145.5 146.3 142.6 150.8 C139.2 157.7 134.8 164.8 130.2 171 Q129 172.3 128 172.3 Q127 172.3 125.8 171 C121.2 164.8 116.8 157.7 113.4 150.8 Q110.5 146.3 115.7 142.3 C119.1 139.5 125.1 136.7 128 136.7Z" fill="url(#beak)"/>
