      <stop offset="53%" stop-color="#cd9a70"/>
      <stop offset="90%" stop-color="#c29771"/>
      <stop offset="1" stop-color="#b68157"/>
    </linearGradient>
    <radialGradient id="head" cx="50%" cy="37%" r="54%">
      <stop stop-color="#4b2915"/>
      <stop offset="55%" stop-color="#663a20"/>
      <stop offset="1" stop-color="#774525"/>
    </radialGradient>
    <linearGradient id="face" x2="0" y2="1">
      <stop stop-color="#dfb68d"/>
      <stop offset="24%" stop-color="#e9c6a8"/>
      <stop offset="46%" stop-color="#ebc9ae"/>
      <stop offset="64%" stop-color="#e7c6aa"/>
      <stop offset="82%" stop-color="#dfb997"/>
      <stop offset="1" stop-color="#d7ac89"/>
