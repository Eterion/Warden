[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "allow"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"

# Keep source locations for workspace debugging without full variable/type records.
[profile.dev]
debug = "line-tables-only"

# Dependencies are stepped through rarely and dominate clean debug builds.
[profile.dev.package."*"]
debug = false
