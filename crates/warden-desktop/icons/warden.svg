<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="19.5 19.5 217 217">
  <!-- The Warden mark: a tawny owl, drawn as vectors (shapes and gradients only). Source of the app, tray and installer icons, and the mark beside Warden's name in the UI. -->
