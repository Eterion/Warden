    <path id="cap" d="M128 39.5 C108 39.5 89 45.6 74 57.6 Q73.5 58.2 72.6 57.7 C60 51 47.6 41.5 36.4 31.9 Q30.6 26.9 29 35.2 C26.4 49 28.6 70.6 40.3 84.6 Q42.3 86.7 43.7 86.1 C31.8 72.9 28.7 50.5 32.1 36.4 Q32.7 33.2 35 35.3 C45.4 44.4 57.6 53.9 72 61.5 Q73.5 62.4 75 61.2 C90.4 48.4 109 42.3 128 42.3 C147 42.3 165.6 48.4 181 61.2 Q182.5 62.4 184 61.5 C198.4 53.9 210.6 44.4 221 35.3 Q223.3 33.2 223.9 36.4 C227.3 50.5 224.2 72.9 212.3 86.1 Q213.7 86.7 215.7 84.6 C227.4 70.6 229.6 49 227 35.2 Q225.4 26.9 219.6 31.9 C208.4 41.5 196 51 183.4 57.7 Q182.5 58.2 182 57.6 C167 45.6 148 39.5 128 39.5Z"/>
    <path id="cap-inset" d="M128 42.3 C109 42.3 90.4 48.4 75 61.2 Q73.5 62.4 72 61.5 C57.6 53.9 45.4 44.4 35 35.3 Q32.7 33.2 32.1 36.4 C28.7 50.5 31.8 72.9 43.7 86.1 C52.7 92.8 65.6 93.6 80 97.5 C102.4 102.4 121.8 115 124 129.2 Q126.1 130.5 128 130.5 Q129.9 130.5 132 129.2 C134.2 115 153.6 102.4 176 97.5 C190.4 93.6 203.3 92.8 212.3 86.1 C224.2 72.9 227.3 50.5 223.9 36.4 Q223.3 33.2 221 35.3 C210.6 44.4 198.4 53.9 184 61.5 Q182.5 62.4 181 61.2 C165.6 48.4 147 42.3 128 42.3Z"/>
    <path id="beak-half" d="M128 136.7 C125.1 136.7 119.1 139.5 115.7 142.3 Q110.5 146.3 113.4 150.8 C116.8 157.7 121.2 164.8 125.8 171 Q126.8 172.3 128 172.3Z"/>
