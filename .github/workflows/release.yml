# Builds, signs and publishes a release when a version tag (vX.Y.Z) is pushed: the installer, its update signature and
# the update manifest (latest.json) the installed app reads. Releases are made only when the user asks
# (docs/releasing.md). The update signing key reaches only the step that bundles and signs, after everything is built.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  CONFIGS: --config crates/warden-desktop/tauri.installer.conf.json --config crates/warden-desktop/tauri.release.conf.json

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Rust
        run: rustup update stable && rustup default stable

      - name: The tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "The tag $env:TAG does not match the workspace version $version." }

      - run: npm ci

      - name: Build the UI, warden.exe and the app
        shell: pwsh
        run: |
          npm run build -w ui
          cargo build --release -p warden-cli
          npx tauri build --no-bundle $env:CONFIGS.Split(' ')

      - name: Bundle and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri bundle --bundles nsis $env:CONFIGS.Split(' ')

      - name: Write the update manifest
        shell: pwsh
        env:
          DOWNLOAD: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          $version = $env:TAG.TrimStart('v')
          $dir = 'target/release/bundle/nsis'
          $exe = "Warden_${version}_x64-setup.exe"
          $manifest = [ordered]@{
            version   = $version
            notes     = "Warden $version"
            pub_date  = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ', [Globalization.CultureInfo]::InvariantCulture)
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content "$dir/$exe.sig" -Raw).Trim()
                url       = "$env:DOWNLOAD/$env:TAG/$exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "$dir/latest.json" -Encoding utf8NoBOM

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $dir = 'target/release/bundle/nsis'
          $exe = "Warden_${version}_x64-setup.exe"
          gh release create $env:TAG "$dir/$exe" "$dir/$exe.sig" "$dir/latest.json" --repo "${{ github.repository }}" --title "Warden $version" --notes "Warden $version"
